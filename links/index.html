<meta charset="UTF-8" />

<title>Gláucia Gianet | Psicóloga EMDR</title>
<meta name="description" content="Psicóloga especialista em EMDR. Atendimento online." />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --rose:       #c9968a;
    --rose-light: #e8c9c2;
    --rose-pale:  #f5eeec;
    --rose-dark:  #9e6d64;
    --cream:      #faf7f5;
    --white:      #ffffff;
    --text:       #3a2f2c;
    --text-soft:  #7a6660;
    --border:     #e8d8d4;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 48px 20px 60px;
  }

  /* ── CARD CONTAINER ── */
  .container {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  /* ── FOTO ── */
  .avatar-wrap {
    position: relative;
    margin-bottom: 20px;
    width: 100%;
    display: flex;
    justify-content: center;
  }

  .avatar {
    width: 260px;
    height: auto;
    border-radius: 20px;
    display: block;
  }

  /* ── NOME E TÍTULO ── */
  .name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.7rem;
    font-weight: 500;
    color: var(--text);
    letter-spacing: .01em;
    text-align: center;
    line-height: 1.1;
  }

  .title {
    font-size: .78rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--rose);
    font-weight: 400;
    margin-top: 6px;
    text-align: center;
  }

  .bio {
    font-size: .88rem;
    color: var(--text-soft);
    text-align: center;
    line-height: 1.6;
    margin-top: 12px;
    max-width: 320px;
  }

  /* ── DIVISOR ── */
  .divider {
    width: 40px;
    height: 1px;
    background: var(--rose-light);
    margin: 24px auto;
  }

  /* ── LINKS ── */
  .links {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .link-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 15px 24px;
    border-radius: 50px;
    text-decoration: none;
    font-size: .85rem;
    letter-spacing: .07em;
    text-transform: uppercase;
    font-weight: 500;
    transition: transform .2s, box-shadow .2s, background .2s;
    cursor: pointer;
  }

  .link-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(201,150,138,.25);
  }

  .link-btn.primary {
    background: var(--rose);
    color: var(--white);
  }

  .link-btn.primary:hover {
    background: var(--rose-dark);
  }

  .link-btn.outline {
    background: var(--white);
    color: var(--rose-dark);
    border: 1.5px solid var(--rose-light);
  }

  .link-btn.outline:hover {
    background: var(--rose-pale);
    border-color: var(--rose);
  }

  .link-btn svg {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
  }

  /* ── RODAPÉ ── */
  .footer {
    margin-top: 40px;
    font-size: .72rem;
    letter-spacing: .06em;
    color: var(--text-soft);
    opacity: .6;
    text-align: center;
  }
</style>
</head>
